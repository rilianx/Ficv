name: Explorar SANFIC

on:
  push:
    paths:
      - scripts/explorar_sanfic.py
      - scripts/sanfic.py
      - scripts/explorar_cinepolis.py
      - .github/workflows/sanfic.yml
  workflow_dispatch:
  schedule:
    - cron: "17 11,23 22-31 10 *"
    - cron: "17 11,23 1-8 11 *"

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/explorar_sanfic.py
      - run: '[ -f scripts/sanfic.py ] && python scripts/sanfic.py || true'
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          for d in fuentes/sanfic programa-sanfic; do [ -e "$d" ] && git add "$d"; done; true
          git diff --cached --quiet || git commit -m "Datos SANFIC"
          git pull --rebase -q || true
          git push
