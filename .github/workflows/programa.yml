name: Programa FICValdivia

on:
  push:
    paths:
      - ficv_programa.py
      - plantilla.html
      - .github/workflows/programa.yml
  workflow_dispatch:
  schedule:
    - cron: "17 11 * 10 *"   # diario en octubre (08:17 Chile) para captar cambios

permissions:
  contents: write

concurrency:
  group: programa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Extraer programa
        run: python ficv_programa.py --dump
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida
          path: salida/
      - name: Guardar resultado en el repositorio
        run: |
          # no borrar un programa bueno si esta ejecución no obtuvo datos
          if [ ! -s salida/programa.json ]; then
            echo "::error::No se obtuvo el programa; se mantiene la versión anterior"
            exit 1
          fi
          rm -rf programa && mkdir -p programa/depuracion
          cp salida/programa.* programa/
          cp -r salida/html salida/api salida/fichas programa/depuracion/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A programa
          git diff --cached --quiet || git commit -m "Actualizar programa FICValdivia"
          git pull --rebase -q || true
          git push
